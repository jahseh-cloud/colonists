plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

base {
	archivesName = 'colonists'
}

repositories {
	// JourneyMap API
	maven { url = "https://maven.blamejared.com" }
	maven { url = "https://jm.gserv.me/repository/maven-public/" }
	// Xaero's Minimap (compile-time only)
	exclusiveContent {
		forRepository {
			maven { url = "https://api.modrinth.com/maven" }
		}
		filter { includeGroup "maven.modrinth" }
	}
}

loom {
	splitEnvironmentSourceSets()

	runs {
		// ./gradlew runSelftest: a headless server that fast-forwards three days and reports (see SelfTest).
		selftest {
			server()
			name "Self test"
			vmArg "-Dcolonists.selftest=true"
			runDir "run"
		}
	}

	mods {
		"colonists" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional map integrations: compiled against, never bundled or required.
	modCompileOnly "info.journeymap:journeymap-api-fabric:${project.journeymap_api_version}"
	modCompileOnly "maven.modrinth:xaeros-minimap:${project.xaeros_minimap_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
