# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
      - name: publish jar (dist branch + "latest" release)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          JAR=$(ls build/libs/colonists-*.jar | grep -v sources | head -1)
          mkdir -p /tmp/dist && cp "$JAR" /tmp/dist/
          cd /tmp/dist
          git init -q -b dist
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add . && git commit -qm "Build ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" dist
          cd "$GITHUB_WORKSPACE"
          gh release delete latest -y --cleanup-tag || true
          gh release create latest "$JAR" --title "Colonists (latest build)" --notes "Drop this jar and Fabric API into your mods folder (Minecraft 1.21.1, Fabric Loader)." --target "$GITHUB_SHA"

  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: prepare server
        run: |
          chmod +x ./gradlew
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-seed=20261107\nview-distance=4\nsimulation-distance=4\nspawn-protection=0\nsync-chunk-writes=false\n" > run/server.properties
      - name: run self-test server (three in-game days, fast-forwarded)
        run: timeout 30m ./gradlew runSelftest --no-daemon < /dev/null || true
      - name: report
        if: always()
        run: |
          LOG=run/logs/latest.log
          grep -E "COLONISTS SELFTEST|COLONISTS HISTORY" "$LOG" | tail -n 200 || true
          echo "---- errors and exceptions ----"
          grep -nE "ERROR|Exception|Caused by|at net\.colonists" "$LOG" | head -n 150 || true
          ls run/crash-reports 2>/dev/null && cat run/crash-reports/* | head -n 120 || true
          grep -q "COLONISTS SELFTEST PASSED" "$LOG"
